[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-handoff"
version = "0.1.0b1"
description = "Secure cross-platform Codex state sync, backup, restore, and handoff"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Codex Handoff contributors" }]
dependencies = [
  "cryptography>=45",
  "google-api-python-client>=2.170",
  "google-auth>=2.40",
  "google-auth-oauthlib>=1.2",
  "platformdirs>=4.3",
  "PySide6>=6.8",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=6"]
packaging = ["pyinstaller>=6.14"]

[project.scripts]
codex-handoff = "codex_handoff.cli:main"

[project.gui-scripts]
codex-handoff-gui = "codex_handoff.gui.app:launch_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
