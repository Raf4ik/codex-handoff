name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64
      - name: Check runner architecture
        run: test "$(uname -m)" = "arm64"
      - name: Build macOS app and disk image
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[packaging]"
          python -m PyInstaller --noconfirm --clean --windowed \
            --name CodexHandoff \
            --osx-bundle-identifier com.codexhandoff.desktop \
            --collect-submodules googleapiclient \
            --collect-submodules google_auth_oauthlib \
            packaging/codex_handoff_gui.py
          hdiutil create -volname CodexHandoff -srcfolder dist/CodexHandoff.app \
            -ov -format UDZO dist/CodexHandoff-macOS-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: CodexHandoff-macOS-arm64
          path: dist/CodexHandoff-macOS-arm64.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[packaging]"
          python -m PyInstaller --noconfirm --clean --windowed `
            --name CodexHandoff `
            --collect-submodules googleapiclient `
            --collect-submodules google_auth_oauthlib `
            --onefile packaging/codex_handoff_gui.py
          Rename-Item dist/CodexHandoff.exe CodexHandoff-Windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CodexHandoff-Windows-x64
          path: dist/CodexHandoff-Windows-x64.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
